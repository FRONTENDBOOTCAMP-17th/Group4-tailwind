<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>템플릿</title>
    <link rel="icon" href="/vite.svg" />
    <link rel="preload" as="font" href="/font/woff2/PretendardVariable.woff2" crossorigin="anonymous" />
    <link rel="stylesheet" as="style" href="/font/pretendardvariable.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="mx-auto grid gap-4 grid-cols-[8px_repeat(10,minmax(18px,1fr))_8px] md:grid-cols-[16px_repeat(10,minmax(45px,1fr))_16px] xl:grid-cols-12">
      <section class="banner grid col-start-1 -col-end-1 text-black leading-1.5 relative overflow-hidden gap-3" role="banner">
        <img src="./assets/banner.webp" alt="우리들의 택시 UT 배너" fetchpriority="high" class="banner-image w-screen h-full object-cover z-0 absolute" />
        <div class="banner-wrap flex flex-col px-6 py-10 gap-7 z-1 relative mx-0 my-0 justify-start items-start xl:justify-center xl:gap-12 xl:p-16 xl:px-[10vw]">
          <h1 class="title-ut text-3xl sm:text-4xl lg:text-5xl font-bold leading-[140%] col-span-2">우리들의 택시, UT</h1>
          <p class="text-base">UT로 안전하고 편안한 차량 서비스를 이용하세요.</p>
          <button type="button" class="buttons icon-button-component show-icon" onclick="window.open('/')">
            <svg class="icon-download w-6 h-6" aria-hidden="true" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M6.29289 9.70711L11.2929 14.7071L12 15.4142L12.7071 14.7071L17.7071 9.70711L16.2929 8.29289L13 11.5858V4H18C19.1046 4 20 4.89543 20 6V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V6C4 4.89543 4.89543 4 6 4H11L11 11.5858L7.70711 8.29289L6.29289 9.70711Z"
                fill="white"
              />
            </svg>
            <span>앱 다운로드</span>
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
