<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>템플릿</title>
    <link rel="icon" href="/vite.svg" />
    <link rel="preload" as="font" href="/font/woff2/PretendardVariable.woff2" crossorigin="anonymous" />
    <link rel="stylesheet" as="style" href="/font/pretendardvariable.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="mx-auto grid gap-4 grid-cols-[8px_repeat(10,minmax(18px,1fr))_8px] md:grid-cols-[16px_repeat(10,minmax(45px,1fr))_16px] xl:grid-cols-12">
      <!-- 여기에 템플릿 코드 작성 / subgrid로 12컬럼 그리드 배치를 상속받고 템플릿의 배치를 해당 그리드 안에서 하면 됨-->
      <section class="grid xl:gap-x-9 gap-y-9 grid-cols-subgrid grid-rows-[auto_repeat(2,max-content)] xl:grid-rows-[auto_max-content] col-span-full bg-neutral-100 px-6 md:px-8 py-10 md:py-14 xl:p-16">
        <h1 class="col-start-2 col-span-10 text-black font-bold text-2xl md:text-3xl xl:text-4xl leading-7">UT 앱에서 더욱 다양한 기능을 만나보세요</h1>
        <a href="#" class="col-start-2 xl:col-start-2 col-span-10 xl:col-span-5 min-w-max flex flex-row flex-nowrap items-center gap-9 bg-white p-4 md:p-8 xl:p-11">
          <div class="size-[104px] shrink-0">
            <img src="/logo.svg" alt="UT 로고" />
          </div>
          <span class="min-w-max flex-1 text-xl font-semibold leading-8">승객 앱 다운로드</span>
          <div class="size-14 justify-self-end">
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
              <path
                d="M46.6666 28L47.3737 27.2929L48.0808 28L47.3737 28.7071L46.6666 28ZM11.6666 29C11.1143 29 10.6666 28.5523 10.6666 28C10.6666 27.4477 11.1143 27 11.6666 27V29ZM33.3737 13.2929L47.3737 27.2929L45.9595 28.7071L31.9595 14.7071L33.3737 13.2929ZM47.3737 28.7071L33.3737 42.7071L31.9595 41.2929L45.9595 27.2929L47.3737 28.7071ZM46.6666 29H11.6666V27H46.6666V29Z"
                fill="currentColor"
              />
            </svg>
          </div>
        </a>
        <a href="#" class="col-start-2 xl:col-start-7 col-span-10 xl:col-span-5 min-w-max flex flex-row flex-nowrap items-center gap-9 bg-white p-4 md:p-8 xl:p-11">
          <div class="size-[104px] shrink-0">
            <img src="/logo.svg" alt="UT 로고" />
          </div>
          <span class="min-w-max flex-1 text-xl font-semibold leading-8">기사 앱 다운로드</span>
          <div class="size-14 justify-self-end">
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
              <path
                d="M46.6666 28L47.3737 27.2929L48.0808 28L47.3737 28.7071L46.6666 28ZM11.6666 29C11.1143 29 10.6666 28.5523 10.6666 28C10.6666 27.4477 11.1143 27 11.6666 27V29ZM33.3737 13.2929L47.3737 27.2929L45.9595 28.7071L31.9595 14.7071L33.3737 13.2929ZM47.3737 28.7071L33.3737 42.7071L31.9595 41.2929L45.9595 27.2929L47.3737 28.7071ZM46.6666 29H11.6666V27H46.6666V29Z"
                fill="currentColor"
              />
            </svg>
          </div>
        </a>
      </section>
    </div>
  </body>
</html>
